<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>東京地下3D — 地下鉄を自由視点で探索</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0e14;
      font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; color: #dde4ee; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }

    #overlay { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: rgba(5, 8, 14, 0.82); backdrop-filter: blur(3px); cursor: pointer; }
    #overlay h1 { font-size: 28px; font-weight: 700; letter-spacing: .08em; }
    #overlay .sub { color: #9fb0c8; font-size: 14px; }
    #overlay .keys { margin-top: 10px; background: rgba(255,255,255,.06); border: 1px solid #2a3854;
      border-radius: 10px; padding: 14px 22px; font-size: 13px; line-height: 2; color: #c3cfdf; }
    #overlay .start { margin-top: 8px; font-size: 15px; color: #7fd0ff; }
    #overlay kbd { background: #1d2a44; border: 1px solid #3a4f78; border-radius: 4px;
      padding: 1px 7px; font-family: inherit; font-size: 12px; margin: 0 2px; }
    #overlay.hidden, .hidden { display: none !important; }

    #hud { position: fixed; left: 12px; bottom: 12px; z-index: 10; font-size: 12px;
      background: rgba(10, 14, 22, 0.72); border: 1px solid #233048; border-radius: 8px;
      padding: 10px 14px; line-height: 1.8; min-width: 230px; pointer-events: none;
      font-variant-numeric: tabular-nums; }
    #hud .big { font-size: 16px; font-weight: 600; }
    #hud .depth-under { color: #ffb46b; }
    #hud .depth-above { color: #7fd0ff; }
    #hud .dim { color: #8294ad; }

    #panel { position: fixed; right: 12px; top: 12px; z-index: 10; width: 240px; font-size: 12px;
      background: rgba(10, 14, 22, 0.82); border: 1px solid #233048; border-radius: 10px;
      padding: 12px 14px; max-height: calc(100vh - 90px); overflow-y: auto; }
    #panel h2 { font-size: 12px; color: #8fa3c0; font-weight: 600; margin: 10px 0 6px;
      letter-spacing: .06em; }
    #panel h2:first-child { margin-top: 0; }
    #panel label.row { display: flex; align-items: center; gap: 7px; padding: 3px 0; cursor: pointer; }
    #panel .chip { width: 12px; height: 12px; border-radius: 3px; flex: none; }
    #panel input[type="range"] { width: 100%; }
    #panel select { width: 100%; background: #131c2c; color: #dde4ee; border: 1px solid #2a3854;
      border-radius: 6px; padding: 5px 6px; font-size: 12px; }
    #panel .note { color: #8294ad; font-size: 11px; line-height: 1.6; margin-top: 4px; }

    #attribution { position: fixed; right: 8px; bottom: 8px; z-index: 10; font-size: 10px;
      color: #7d8da6; background: rgba(10, 14, 22, 0.6); padding: 4px 8px; border-radius: 6px; }
    #attribution a { color: #9fc0e8; text-decoration: none; }

    #loading { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center;
      justify-content: center; background: #0b0e14; font-size: 14px; color: #9fb0c8; }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="loading">データを読み込んでいます…</div>

  <div id="overlay" class="hidden">
    <h1>東京地下3D</h1>
    <div class="sub">東京の地下鉄網を、正確な位置と深さで探索する</div>
    <div class="keys">
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 水平移動 /
      <kbd>Space</kbd> 上昇 / <kbd>Shift</kbd> 下降<br />
      マウス: 視点 / ホイール: 移動速度 / <kbd>Esc</kbd> マウス解放
    </div>
    <div class="start">クリックして探索を開始</div>
  </div>

  <div id="hud"></div>
  <div id="panel"></div>
  <div id="attribution"></div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
