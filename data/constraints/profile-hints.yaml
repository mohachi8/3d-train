# 駅間の縦断制御点(補間ヒント)。
# 駅深度だけでは表現できない「駅間の山・谷」(地上区間・河川下越え等)をここに足す。
hints:
  - line_id: twr.rinkai
    lonlat: [139.7422, 35.6082]
    tp_m: -43.0
    note: >
      りんかい線の最深部。大井町〜品川シーサイド間(新木場方面行き・上り線)で
      海抜-43.761m(公式X)。武蔵野台地の下を上下2段シールドで潜る区間。
      モデルは単一トンネルのため上り線レール面より約1m上に設定。
    sources:
      - title: "りんかい線 公式 お知らせ on X — 最深部は海抜マイナス43.761m"
        url: "https://x.com/twr_official/status/347272766900277248"
  - line_id: tokyo-metro.marunouchi
    lonlat: [139.7646, 35.6996]
    tp_m: 9.0
    note: >
      御茶ノ水〜淡路町間の神田川橋梁。丸ノ内線が地上に出て神田川(お茶の水渓谷)を
      鉄橋で渡る。T.P.+9m は渓谷内の橋梁レール面の推定値(要精査)。
    sources:
      - title: "丸ノ内線 神田川橋梁(御茶ノ水付近の地上区間)— 一般知識に基づく推定"
        method: estimated-from-structure
