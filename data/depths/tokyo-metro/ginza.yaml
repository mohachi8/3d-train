# 銀座線 駅深度データ
#
# 主な出典: 「地下鉄銀座線 駅の深さ」(レオナと鉄道, ameblo) の編纂値。
# 検索スニペット経由で取得しており原典全文での再確認は未了(→ confidence: secondary)。
# 銀座線の平均深度約9m(東洋経済 2017)と整合することを確認済み。
line_id: tokyo-metro.ginza
default_platform:
  length_m: 105   # 6両×16m級
  width_m: 11
  height_m: 5
stations:
  - id: shibuya
    name: 渋谷
    platforms:
      - id: main
        depth_m: -13.0
        depth_datum: ground
        confidence: estimated
        sources:
          - title: "推定: ホームは渋谷スクランブルスクエア脇の地上3階(高さ約13mと仮定)"
            method: estimated-from-structure
          - title: "なぜ地下鉄なのに、地上3階? 銀座線、丸ノ内線が地上に出てしまう理由(楽待)"
            url: "https://www.rakumachi.jp/news/column/139800"
          - title: "渋谷駅の顔だった「地下鉄が地上3階から発車するビル」(乗りものニュース)"
            url: "https://trafficnews.jp/post/122047"
        note: 渋谷は谷底のため、台地区間を走ってきたトンネルがそのまま地上3階の高さになる
