# 全対象路線のレジストリ。
#
# - enabled: true の路線だけがビルドされる。有効化には data/depths/<operator>/<line>.yaml
#   (全駅の深度)と抽出済み線形(data/sources/extracted/lines/)が必要。
# - phase: 1=MVP(銀座・丸ノ内・大江戸) / 2=地下鉄13路線 / 3=JR・私鉄地下区間
# - n02_match: 国土数値情報 N02 からの抽出キー(extract-n02 用)
# - mt3d_id:   mini-tokyo-3d からのブートストラップ抽出キー(import-mt3d 用)
lines:
  # ========== Phase 1: MVP ==========
  - id: tokyo-metro.ginza
    name: 銀座線
    name_en: Ginza Line
    operator: tokyo-metro
    color: "#FF9500"
    phase: 1
    enabled: true
    underground: full   # 渋谷付近の高架区間は深度データ(負値)で表現する
    n02_match: { operator: 東京地下鉄, line: 3号線銀座線 }
    mt3d_id: TokyoMetro.Ginza
    tunnel_radius_m: 4.0

  - id: tokyo-metro.marunouchi
    name: 丸ノ内線
    name_en: Marunouchi Line
    operator: tokyo-metro
    color: "#F62E36"
    phase: 1
    enabled: true
    underground: full   # 四ツ谷・後楽園・御茶ノ水付近の地上区間は深度データで表現
    n02_match: { operator: 東京地下鉄, line: 4号線丸ノ内線 }
    mt3d_id: TokyoMetro.Marunouchi
    tunnel_radius_m: 4.0

  - id: tokyo-metro.marunouchi-branch
    name: 丸ノ内線(方南町支線)
    name_en: Marunouchi Line Honancho Branch
    operator: tokyo-metro
    color: "#F62E36"
    phase: 1
    enabled: true
    underground: full
    n02_match: { operator: 東京地下鉄, line: 4号線丸ノ内線分岐線 }
    mt3d_id: TokyoMetro.MarunouchiBranch
    tunnel_radius_m: 4.0

  - id: toei.oedo
    name: 大江戸線
    name_en: Oedo Line
    operator: toei
    color: "#B6007A"
    phase: 1
    enabled: true
    underground: full   # 光が丘付近の駅も地下
    n02_match: { operator: 東京都, line: 12号線大江戸線 }
    mt3d_id: Toei.Oedo
    tunnel_radius_m: 3.8  # リニア地下鉄の小断面シールド

  # ========== Phase 2: 地下鉄13路線 ==========
  # 地上・高架区間を含む路線も underground: full として扱い、地上区間は
  # 駅深度の負値(地表より上)で縦断を表現する(坑口の厳密な扱いは Phase 3)。
  - { id: tokyo-metro.hibiya, name: 日比谷線, name_en: Hibiya Line, operator: tokyo-metro,
      color: "#B5B5AC", phase: 2, enabled: true, underground: full,
      n02_match: { operator: 東京地下鉄, line: 2号線日比谷線 }, mt3d_id: TokyoMetro.Hibiya,
      exclude_stations: [新越谷] }   # 東武直通区間
  - { id: tokyo-metro.tozai, name: 東西線, name_en: Tozai Line, operator: tokyo-metro,
      color: "#009BBF", phase: 2, enabled: true, underground: full,
      n02_match: { operator: 東京地下鉄, line: 5号線東西線 }, mt3d_id: TokyoMetro.Tozai }
  - { id: tokyo-metro.chiyoda, name: 千代田線, name_en: Chiyoda Line, operator: tokyo-metro,
      color: "#00BB85", phase: 2, enabled: true, underground: full,
      n02_match: { operator: 東京地下鉄, line: 9号線千代田線 }, mt3d_id: TokyoMetro.Chiyoda,
      exclude_stations: [町田, 成城学園前, 北綾瀬],   # 小田急直通区間 + 北綾瀬は支線側で扱う
      exclude_bbox: [139.8205, 35.7625, 139.8400, 35.7850] }   # 北綾瀬支線の線形
  - { id: tokyo-metro.chiyoda-branch, name: 千代田線(北綾瀬支線), name_en: Chiyoda Line Kita-Ayase Branch,
      operator: tokyo-metro, color: "#00BB85", phase: 2, enabled: true, underground: full,
      n02_match: { operator: 東京地下鉄, line: 9号線千代田線 }, mt3d_id: TokyoMetro.Chiyoda,
      clip_bbox: [139.8205, 35.7590, 139.8400, 35.7850] }   # 綾瀬〜北綾瀬のみ切り出し
  - { id: tokyo-metro.yurakucho, name: 有楽町線, name_en: Yurakucho Line, operator: tokyo-metro,
      color: "#C1A470", phase: 2, enabled: true, underground: full,
      n02_match: { operator: 東京地下鉄, line: 8号線有楽町線 }, mt3d_id: TokyoMetro.Yurakucho }
  - { id: tokyo-metro.hanzomon, name: 半蔵門線, name_en: Hanzomon Line, operator: tokyo-metro,
      color: "#8F76D6", phase: 2, enabled: true, underground: full,
      n02_match: { operator: 東京地下鉄, line: 11号線半蔵門線 }, mt3d_id: TokyoMetro.Hanzomon }
  - { id: tokyo-metro.namboku, name: 南北線, name_en: Namboku Line, operator: tokyo-metro,
      color: "#00AC9B", phase: 2, enabled: true, underground: full,
      n02_match: { operator: 東京地下鉄, line: 7号線南北線 }, mt3d_id: TokyoMetro.Namboku }
  - { id: tokyo-metro.fukutoshin, name: 副都心線, name_en: Fukutoshin Line, operator: tokyo-metro,
      color: "#9C5E31", phase: 2, enabled: true, underground: full,
      n02_match: { operator: 東京地下鉄, line: 13号線副都心線 }, mt3d_id: TokyoMetro.Fukutoshin }
  - { id: toei.asakusa, name: 浅草線, name_en: Asakusa Line, operator: toei,
      color: "#E85298", phase: 2, enabled: true, underground: full,
      n02_match: { operator: 東京都, line: 1号線浅草線 }, mt3d_id: Toei.Asakusa }
  - { id: toei.mita, name: 三田線, name_en: Mita Line, operator: toei,
      color: "#0079C2", phase: 2, enabled: true, underground: full,
      n02_match: { operator: 東京都, line: 6号線三田線 }, mt3d_id: Toei.Mita }
  - { id: toei.shinjuku, name: 新宿線, name_en: Shinjuku Line, operator: toei,
      color: "#6CBB5A", phase: 2, enabled: true, underground: full,
      n02_match: { operator: 東京都, line: 10号線新宿線 }, mt3d_id: Toei.Shinjuku }

  # ========== Phase 3: JR・私鉄の地下区間 ==========
  # underground: partial の路線は地下区間+前後の地上駅のみを clip_bbox で切り出す。
  # 坑口は地上駅の負深度(高架)と地下駅深度の PCHIP 補間で表現される。
  - { id: twr.rinkai, name: りんかい線, name_en: Rinkai Line, operator: twr,
      color: "#00418E", phase: 3, enabled: true, underground: partial,
      n02_match: { operator: 東京臨海高速鉄道, line: りんかい線 }, mt3d_id: TWR.Rinkai,
      tunnel_radius_m: 5.0 }
  - { id: jr-east.sobu-rapid, name: 総武快速線(地下区間), name_en: Sobu Rapid Line (Underground),
      operator: jr-east, color: "#0074BE", phase: 3, enabled: true, underground: partial,
      n02_match: { operator: 東日本旅客鉄道, line: 総武線 }, mt3d_id: JR-East.SobuRapid,
      clip_bbox: [139.7550, 35.6680, 139.8250, 35.7050],   # 東京〜馬喰町(地下区間)
      exclude_stations: [錦糸町],   # 両国〜錦糸町の高架線形は mt3d が別路線参照のため対象外
      tunnel_radius_m: 5.0 }
  - { id: jr-east.yokosuka, name: 横須賀線(地下区間), name_en: Yokosuka Line (Underground),
      operator: jr-east, color: "#0074BE", phase: 3, enabled: true, underground: partial,
      n02_match: { operator: 東日本旅客鉄道, line: 横須賀線 }, mt3d_id: JR-East.Yokosuka,
      clip_bbox: [139.7330, 35.6220, 139.7720, 35.6900],   # 東京〜品川
      tunnel_radius_m: 5.0 }
  - { id: jr-east.keiyo, name: 京葉線(地下区間), name_en: Keiyo Line (Underground),
      operator: jr-east, color: "#C9242F", phase: 3, enabled: true, underground: partial,
      n02_match: { operator: 東日本旅客鉄道, line: 京葉線 }, mt3d_id: JR-East.Keiyo,
      clip_bbox: [139.7550, 35.6200, 139.8400, 35.6900],   # 東京〜新木場
      tunnel_radius_m: 5.0 }
