<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tokyo Underground Spectator</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.165.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-label="Tokyo subway underground 3D scene"></canvas>

      <section class="panel panel-left" aria-label="操作パネル">
        <div class="brand">
          <span class="brand-mark"></span>
          <div>
            <h1>Tokyo Underground Spectator</h1>
            <p>東京の地下鉄地下空間を、スペクテイター視点で探索</p>
          </div>
        </div>

        <button id="startButton" class="primary-button" type="button">
          <span aria-hidden="true">▶</span>
          <span>探索を開始</span>
        </button>

        <div class="control-grid" aria-label="移動操作">
          <kbd>W</kbd><span>前進</span>
          <kbd>S</kbd><span>後退</span>
          <kbd>A</kbd><span>左移動</span>
          <kbd>D</kbd><span>右移動</span>
          <kbd>Q</kbd><span>下降</span>
          <kbd>E</kbd><span>上昇</span>
          <kbd>Shift</kbd><span>高速移動</span>
          <kbd>Mouse</kbd><span>視線移動</span>
        </div>

        <div class="section-title">表示</div>
        <label class="toggle">
          <input id="toggleSurface" type="checkbox" checked />
          <span>地上面と街区</span>
        </label>
        <label class="toggle">
          <input id="toggleLabels" type="checkbox" checked />
          <span>駅名ラベル</span>
        </label>
        <label class="toggle">
          <input id="toggleFacilities" type="checkbox" checked />
          <span>換気塔・縦連絡</span>
        </label>

        <div class="section-title">路線</div>
        <div id="lineToggles" class="line-toggles"></div>
      </section>

      <section class="panel panel-right" aria-label="位置情報">
        <div class="readout">
          <span>座標</span>
          <strong id="positionReadout">0, -22, 0</strong>
        </div>
        <div class="readout">
          <span>深度</span>
          <strong id="depthReadout">地下 22m</strong>
        </div>
        <div class="readout">
          <span>近い駅</span>
          <strong id="nearestReadout">大手町</strong>
        </div>
      </section>

      <nav class="station-jump" aria-label="駅へ移動">
        <button type="button" data-station="Overview">全体</button>
        <button type="button" data-station="Otemachi">大手町</button>
        <button type="button" data-station="Tokyo">東京</button>
        <button type="button" data-station="Ginza">銀座</button>
        <button type="button" data-station="Iidabashi">飯田橋</button>
        <button type="button" data-station="Shinjuku">新宿</button>
        <button type="button" data-station="Shibuya">渋谷</button>
        <button type="button" data-station="Roppongi">六本木</button>
        <button type="button" data-station="Ueno">上野</button>
      </nav>

      <div id="lockNotice" class="lock-notice" aria-live="polite">
        画面をクリックすると視点操作に戻ります
      </div>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
